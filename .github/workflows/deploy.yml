name: Build Static Site

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static site
        run: bun run build

      - name: Inspect build output
        run: |
          echo "=== ROOT ==="
          ls -la

          echo "=== DIST ==="
          if [ -d "dist" ]; then
          find dist -maxdepth 3 -type f | head -100
          else
          echo "NO dist DIRECTORY"
          fi

          echo "=== OUTPUT ==="
          if [ -d ".output" ]; then
          find .output -maxdepth 3 -type f | head -100
          else
          echo "NO .output DIRECTORY"
          fi

      - name: Prepare deployment files
        run: |
          rm -rf deploy-output
          mkdir deploy-output
          cp -R dist/client/. deploy-output/

          cat > deploy-output/.cpanel.yml <<'EOF'
          ---
          deployment:
            tasks:
              - export DEPLOYPATH=/home/qatalogu/public_html/
              - /bin/cp -R ./* $DEPLOYPATH
          EOF

      - name: Publish deployment branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy-output
          publish_branch: cpanel-deploy
          force_orphan: true
